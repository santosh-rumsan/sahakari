name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read


    env:
      SHA_TAG: ${{ github.sha }}
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Import Secrets
        uses: hashicorp/vault-action@v2.4.0
        with:
          url: ${{ secrets.VAULT_URL }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            github/data/general/docker/esatya username | DOCKERHUB_USERNAME ;
            github/data/general/docker/esatya password | DOCKERHUB_TOKEN ;

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/sahakari-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/sahakari-web:${{ github.sha }}
